<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="" method="post">
      <fieldset>
        <legend>Aunthication</legend>
        <label for="username">username</label>
        <input type="text" maxlength="20" name="useraname" id="useraname" />
        <label for="email" aria-placeholder="set your name">Email</label>
        <input type="email" placeholder="put email" id="email" required />
        <label for="">password</label>
        <input type="password" name="password" id="password" required />
      </fieldset>
      <br />
      <!--Input type radio--->
      <input type="radio" value="M" name="sex" id="M" checked /><label for="M"
        >Male</label
      >
      <input type="radio" value="F" name="sex" id="F" /><label for="F"
        >Female</label
      >
      <input type="radio" value="Other" name="sex" id="other" /><label
        for="other"
        >Other</label
      >
      <br />
      <!--Checkbox--->
      <br />
      <input
        type="checkbox"
        value="english"
        id="english"
        name="language"
      /><label for="english">English</label>
      <input
        type="checkbox"
        value="khmer"
        id="khmer"
        name="language"
        checked
      /><label for="khmer">Khmer</label>
      <input
        type="checkbox"
        value="chinese"
        id="chinese"
        name="language"
      /><label for="chinese">Chinese</label>

      <br />
      <textarea name="longtext" id="longtext" rows="30" cols="20">
        Hello here is we use for apply long text
      </textarea>
      <br />
      <select name="shift" id="">
        <option value="morning">Morning</option>
        <option value="morningafternoon" selected>Morning-Afternoon</option>
        <option value="Afternoon">Afternoon</option>
        <option value="Evening">Evening</option>
      </select>
      <br />
      <br />
      <label for="phonenumber">Phone Number</label>
      <input id="phonenumber" type="tel" pattern="(\+855|0)[0-9]{8,9}" />
      <button type="submit">LOGIN</button>
      <button type="reset">Clear</button>
    </form>
  </body>
</html>
